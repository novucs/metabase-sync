name: Metabase apply

on:
  push:
    branches: [main]
    paths:
      - "metabase/**"

concurrency:
  group: metabase-apply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    # Add required reviewers to the production environment to approve each apply.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v5

      - name: Install metabase-sync
        run: uv tool install metabase-sync==0.4.0

      - name: Apply
        working-directory: metabase
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: metabase-sync apply --auto-approve

      - name: Commit the state and new entity ids
        if: always()
        working-directory: metabase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if ! git diff --cached --quiet; then
            git commit -m "record metabase-sync apply [skip ci]"
            git pull --rebase
            git push
          fi
