name: Metabase drift detection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install metabase-sync
        run: uv tool install metabase-sync==0.4.3

      - name: Export live state
        working-directory: metabase
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: metabase-sync export --auto-approve

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DRIFT_PR_TOKEN }}
          commit-message: "export changes made in Metabase"
          branch: metabase-drift/${{ github.run_id }}
          title: "Changes made in Metabase"
          body: |
            The nightly export found changes made in Metabase that aren't in `main`.
            Merge to keep them. Otherwise the next apply undoes them.
            It also undoes any edits in `main` that were never applied, so check the diff.
          delete-branch: true
