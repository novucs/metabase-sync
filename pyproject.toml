[project]
name = "metabase-sync"
version = "0.1.0"
description = "Metabase as code: export, plan, and apply dashboards, cards, collections, snippets and pulses via the Metabase REST API."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "novucs" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["metabase", "iac", "as-code", "dashboards", "cli", "gitops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.6.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.12.5",
]

[project.urls]
Homepage = "https://github.com/novucs/metabase-sync"
Repository = "https://github.com/novucs/metabase-sync"
Issues = "https://github.com/novucs/metabase-sync/issues"
Changelog = "https://github.com/novucs/metabase-sync/blob/main/CHANGELOG.md"

[project.scripts]
metabase-sync = "metabase_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabase_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/metabase_sync", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.410",
    "pytest>=8.3.2",
    "ruff>=0.15.18",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a live Metabase (spun up via docker compose). Opt in with `-m integration`.",
]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` in argument defaults is the documented Typer idiom.
"src/metabase_sync/cli.py" = ["B008"]
