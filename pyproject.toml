[project]
name = "metabase-sync"
version = "0.4.0"
description = "Metabase as code: export, plan, and apply collections, questions, dashboards, snippets, and subscriptions in the metabase/representations format, using the Metabase REST API."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "novucs" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
keywords = ["metabase", "iac", "as-code", "dashboards", "cli", "gitops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-slugify>=9.1.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/novucs/metabase-sync"
Repository = "https://github.com/novucs/metabase-sync"
Issues = "https://github.com/novucs/metabase-sync/issues"
Changelog = "https://github.com/novucs/metabase-sync/blob/main/CHANGELOG.md"

[project.scripts]
metabase-sync = "metabase_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabase_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/metabase_sync", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
minversion = "9.2"
addopts = "-ra -n 4"
testpaths = ["tests"]
markers = [
    "integration: requires a live Metabase (spun up via docker compose). Opt in with `-m integration`.",
    "contracts: downloads Metabase's published schemas for every tested version.",
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
