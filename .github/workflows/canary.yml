name: Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest:
    name: Integration tests (newest Metabase)
    runs-on: ubuntu-latest
    env:
      METABASE_VERSION: latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Pull the newest Metabase
        run: docker pull metabase/metabase:latest
      - name: Run integration tests
        run: uv run pytest tests/integration --tb=short
        timeout-minutes: 15
