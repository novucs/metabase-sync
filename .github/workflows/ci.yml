name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: pyright
        run: uv run pyright src tests

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration --ignore=tests/contracts

  contracts:
    name: Contracts with Metabase's published schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Run contract tests
        run: uv run pytest tests/contracts

  integration:
    name: Integration tests (Metabase ${{ matrix.metabase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        metabase: [v0.58.39, v0.64.5.2, v0.65.3.3]
    env:
      METABASE_VERSION: ${{ matrix.metabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Run integration tests
        run: uv run pytest tests/integration --tb=short
        timeout-minutes: 15

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
