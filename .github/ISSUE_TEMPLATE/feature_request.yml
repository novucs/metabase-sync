name: Feature request
description: Suggest a new behaviour or workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the workflow you're trying to support?
      description: Describe the human scenario, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the tool to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What workaround are you using today?
