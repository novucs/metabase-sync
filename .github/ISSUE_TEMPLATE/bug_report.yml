name: Bug report
description: Something went wrong while running metabase-sync.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        Include the output of `metabase-sync --version`, your Metabase
        version, and the output of `metabase-sync status`.

  - type: textarea
    id: status
    attributes:
      label: Versions and `metabase-sync status` output
      render: text
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: "e.g. `metabase-sync apply --debug`"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the full error message / stack trace.
      render: shell
    validations:
      required: true

  - type: textarea
    id: plan_json
    attributes:
      label: "`metabase-sync plan --json` output (optional)"
      description: |
        If the issue is around plan/apply output: paste the relevant slice of
        the plan. Strip anything sensitive before posting.
      render: json

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else you'd like us to know.
